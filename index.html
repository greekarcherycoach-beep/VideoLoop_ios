<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archery Test</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        video {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0;
        }
        #startContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #222; display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        #startBtn {
            background: #ff9500; color: #000; padding: 20px 40px;
            font-size: 20px; font-weight: bold; border-radius: 12px; border: none;
        }
    </style>
</head>
<body>

    <div id="startContainer">
        <button id="startBtn">📷 ΕΝΑΡΞΗ ΚΑΜΕΡΑΣ</button>
    </div>

    <!-- Εμφανίζουμε το βίντεο απευθείας στην οθόνη χωρίς canvas -->
    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>

    <script>
        const video = document.getElementById('liveVideo');
        const startContainer = document.getElementById('startContainer');
        const startBtn = document.getElementById('startBtn');

        // Απευθείας έναρξη με το άγγιγμα
        startBtn.addEventListener('click', async () => {
            startContainer.style.display = 'none';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment" // Πίσω κάμερα
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert("Σφάλμα: " + err.name + "\n" + err.message);
            }
        });
    </script>
</body>
</html>
