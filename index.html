<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archery Lab Clean</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Εμφανίζουμε το βίντεο native για να μην τρώει RAM */
        video {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        #startContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        #startBtn {
            background: #ff9500; color: #000; padding: 20px 40px;
            font-size: 20px; font-weight: bold; border-radius: 12px; border: none;
            cursor: pointer;
        }
        #ui-overlay {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 16px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none;
        }
        button {
            width: 100%; background: #ff9500; color: #000; border: none; 
            padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="startContainer">
        <button id="startBtn">📷 ΕΝΑΡΞΗ ΚΑΜΕΡΑΣ</button>
    </div>

    <!-- Native iOS video container -->
    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>
    
    <div id="ui-overlay">
        <button id="toggleCamBtn">🔄 ΑΛΛΑΓΗ ΚΑΜΕΡΑΣ (ΕΜΠΡΟΣ/ΠΙΣΩ)</button>
    </div>

    <script>
        const video = document.getElementById('liveVideo');
        const startContainer = document.getElementById('startContainer');
        const startBtn = document.getElementById('startBtn');
        const uiOverlay = document.getElementById('ui-overlay');
        const toggleCamBtn = document.getElementById('toggleCamBtn');

        let stream = null;
        let currentFacingMode = 'environment';

        startBtn.addEventListener('click', () => {
            startContainer.style.display = 'none';
            uiOverlay.style.display = 'block';
            initCamera();
        });

        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            try {
                // Ζητάμε την κάμερα με τον πιο απλό και ελαφρύ native τρόπο
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                // Αναγκάζουμε το iOS να παίξει το stream
                await video.play();
            } catch (err) {
                alert("Σφάλμα συστήματος: " + err.message);
            }
        }

        toggleCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            // Εφαρμογή εφέ καθρέφτη (mirror) μόνο για την μπροστινή κάμερα
            if (currentFacingMode === 'user') {
                video.style.transform = 'scaleX(-1)';
            } else {
                video.style.transform = 'scaleX(1)';
            }
            initCamera();
        });
    </script>
</body>
</html>
