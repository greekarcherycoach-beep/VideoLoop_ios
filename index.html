<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archery Lab Fullscreen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ArcheryLab">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #canvasContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            z-index: 10; width: 90%; max-width: 400px;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 16px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        label { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; }
        input[type="range"] { flex-grow: 1; accent-color: #ff3b30; }
        #delayValue { color: #ff9500; font-weight: bold; min-width: 45px; text-align: right; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        button {
            flex: 1; background: #ff9500; color: #000; border: none;
            padding: 10px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer;
        }
        button.active { background: #ff3b30; color: #fff; }
        #zoomBadge {
            position: absolute; top: 40px; left: 20px; background: rgba(0,0,0,0.7);
            color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;
            z-index: 5; pointer-events: none; display: none;
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
    </div>
    <div id="zoomBadge">Zoom: 1.0x</div>
    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>
    
    <div id="ui-overlay">
        <div class="row">
            <label>⏱ Καθυστέρηση:</label>
            <input type="range" id="delaySlider" min="0.5" max="10" step="0.5" value="3">
            <span id="delayValue">3.0s</span>
        </div>
        <div class="btn-group">
            <button id="toggleCamBtn">🔄 Κάμερα</button>
            <button id="drawModeBtn">✏️ Σχεδίαση</button>
            <button id="clearDrawBtn">🗑️ Σβήσιμο</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }

        const video = document.getElementById('liveVideo');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const drawModeBtn = document.getElementById('drawModeBtn');
        const clearDrawBtn = document.getElementById('clearDrawBtn');
        const zoomBadge = document.getElementById('zoomBadge');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let frameBuffer = [];
        let drawingLines = [];
        let currentLine = null;
        
        let isDrawingMode = false;
        let currentFacingMode = localStorage.getItem('facingMode') || 'environment';
        let currentDelay = parseFloat(localStorage.getItem('delayValue')) || 3.0;
        
        delaySlider.value = currentDelay;
        delayValue.textContent = currentDelay.toFixed(1) + 's';

        let scale = 1.0, offsetX = 0, offsetY = 0;
        let startX = 0, startY = 0, startScale = 1.0, isPanning = false;
        let initialPinchDist = 0;

        let fps = 30;
        let lastTime = performance.now();
        let stream = null;

        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: false
                });
                video.srcObject = stream;
                video.play();
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        video.onloadedmetadata = () => {
            resizeCanvases();
            requestAnimationFrame(animationLoop);
        };

        function resizeCanvases() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            bufferCanvas.width = video.videoWidth;
            bufferCanvas.height = video.videoHeight;
        }

        window.addEventListener('resize', resizeCanvases);

        delaySlider.addEventListener('input', (e) => {
            currentDelay = parseFloat(e.target.value);
            delayValue.textContent = currentDelay.toFixed(1) + 's';
            localStorage.setItem('delayValue', currentDelay);
        });

        toggleCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            localStorage.setItem('facingMode', currentFacingMode);
            initCamera();
        });

        drawModeBtn.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;
            drawModeBtn.classList.toggle('active', isDrawingMode);
        });

        clearDrawBtn.addEventListener('click', () => {
            drawingLines = [];
        });

        canvas.addEventListener('touchstart', (e) => {
            if (isDrawingMode) {
                const rect = canvas.getBoundingClientRect();
                const t = e.touches[0];
                currentLine = [{
                    x: ((t.clientX - rect.left) / rect.width) * canvas.width,
                    y: ((t.clientY - rect.top) / rect.height) * canvas.height
                }];
                drawingLines.push(currentLine);
            } else {
                if (e.touches.length === 1) {
                    isPanning = true;
                    startX = e.touches[0].clientX - offsetX;
                    startY = e.touches[0].clientY - offsetY;
                } else if (e.touches.length === 2) {
                    isPanning = false;
                    startScale = scale;
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawingMode && currentLine) {
                const rect = canvas.getBoundingClientRect();
                const t = e.touches[0];
                currentLine.push({
                    x: ((t.clientX - rect.left) / rect.width) * canvas.width,
                    y: ((t.clientY - rect.top) / rect.height) * canvas.height
                });
            } else {
                if (isPanning && e.touches.length === 1) {
                    offsetX = e.touches[0].clientX - startX;
                    offsetY = e.touches[0].clientY - startY;
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    scale = Math.max(1.0, Math.min(5.0, startScale * (dist / initialPinchDist)));
                    zoomBadge.style.display = scale > 1.0 ? 'block' : 'none';
                    zoomBadge.textContent = `Zoom: ${scale.toFixed(1)}x`;
                }
            }
        });

        canvas.addEventListener('touchend', () => {
            isPanning = false;
            currentLine = null;
        });

        function animationLoop(now) {
            const delta = now - lastTime;
            lastTime = now;
            if (delta > 0) fps = (fps * 0.9) + ((1000 / delta) * 0.1);

            bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
            const frameData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            frameBuffer.push(frameData);

            const requiredBufferLength = Math.max(1, Math.round(currentDelay * fps));
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (frameBuffer.length >= requiredBufferLength) {
                const delayedFrame = frameBuffer.shift();
                
                ctx.save();
                ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
                ctx.scale(scale, scale);
                
                if (currentFacingMode === 'user') ctx.scale(-1, 1);
                
                const cw = canvas.width, ch = canvas.height;
                const iw = bufferCanvas.width, ih = bufferCanvas.height;
                const scaleFactor = Math.max(cw / iw, ch / ih);
