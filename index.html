<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archery Lab - Video Delay</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvasContainer {
            position: relative;
            width: 100vw;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: none;
        }

        #liveVideo {
            display: none;
        }

        /* PIP Live Window Overlay */
        #pipContainer {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 95px;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #pipVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1);
        }
        #pipVideo.mirror {
            transform: scaleX(-1);
        }

        #controls {
            width: 100vw;
            height: 25vh;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
            z-index: 5;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        label {
            font-size: 15px;
            font-weight: 600;
            color: #ebebf5;
        }

        input[type="range"] {
            width: 180px;
            accent-color: #ffcc00;
        }

        #delayValue {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            color: #ffcc00;
            min-width: 40px;
        }

        button {
            background-color: #2c2c2e;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.active {
            background-color: #ffcc00;
            color: #111;
        }

        #startBtn {
            background-color: #ffcc00;
            color: #111;
            padding: 14px 28px;
            font-size: 16px;
            border: none;
        }

        #zoomBadge {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #ffcc00;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="displayCanvas"></canvas>
        <div id="zoomBadge">Zoom: 1.0x</div>
        
        <!-- Live PIP Windows -->
        <div id="pipContainer" style="display:none;">
            <video id="pipVideo" autoplay playsinline muted webkit-playsinline></video>
        </div>
    </div>

    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>

    <div id="controls">
        <div class="control-group">
            <label for="delaySlider">⏱ Καθυστέρηση:</label>
            <input type="range" id="delaySlider" min="0.5" max="10" step="0.5" value="3">
            <span id="delayValue">3.0s</span>
        </div>
        
        <div class="btn-group" id="mainControls" style="display:none;">
            <button id="cameraToggleBtn">🔄 Αλλαγή Κάμερας</button>
            <button id="drawModeBtn">✏️ Σχεδίαση</button>
            <button id="clearDrawBtn">🗑️ Καθαρισμός</button>
            <button id="resetZoomBtn">⟲ Reset Zoom</button>
        </div>

        <button id="startBtn">Έναρξη Κάμερας</button>
    </div>

    <script>
        const video = document.getElementById('liveVideo');
        const pipVideo = document.getElementById('pipVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const startBtn = document.getElementById('startBtn');
        const mainControls = document.getElementById('mainControls');
        const cameraToggleBtn = document.getElementById('cameraToggleBtn');
        const drawModeBtn = document.getElementById('drawModeBtn');
        const clearDrawBtn = document.getElementById('clearDrawBtn');
        const resetZoomBtn = document.getElementById('resetZoomBtn');
        const zoomBadge = document.getElementById('zoomBadge');
        const pipContainer = document.getElementById('pipContainer');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let frameBuffer = [];
        let isRunning = false;
        let fps = 30;
        let lastFrameTime = performance.now();
        let currentFacingMode = localStorage.getItem('facingMode') || 'environment';
        
        // Load initial delay from localStorage
        const savedDelay = localStorage.getItem('delayValue');
        if (savedDelay) {
            delaySlider.value = savedDelay;
            delayValue.textContent = parseFloat(savedDelay).toFixed(1) + 's';
        }

        // Viewport / Zoom State
        let scale = 1.0;
        let offsetX = 0;
        let offsetY = 0;
        let isDrawingMode = false;
        
        // Multi-touch Zoom variables
        let tpCache = [];
        let startScale = 1.0;
        let startPanX = 0;
        let startPanY = 0;
        let isDragging = false;
        let lastTouchX = 0;
        let lastTouchY = 0;

        // Drawings path storage
        let drawings = [];
        let isWriting = false;

        delaySlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value).toFixed(1);
            delayValue.textContent = val + 's';
            localStorage.setItem('delayValue', val);
        });

        startBtn.addEventListener('click', () => {
            initCamera();
        });

        cameraToggleBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            localStorage.setItem('facingMode', currentFacingMode);
            initCamera();
        });

        drawModeBtn.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;
            drawModeBtn.classList.toggle('active', isDrawingMode);
        });

        clearDrawBtn.addEventListener('click', () => {
            drawings = [];
        });

        resetZoomBtn.addEventListener('click', () => {
            scale = 1.0;
            offsetX = 0;
            offsetY = 0;
            updateZoomBadge();
        });

        function updateZoomBadge() {
            zoomBadge.textContent = `Zoom: ${scale.toFixed(1)}x`;
        }

        async function initCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                pipVideo.srcObject = stream;
                video.play();
                pipVideo.play();
                
                if(currentFacingMode === 'user') {
                    pipVideo.classList.add('mirror');
                } else {
                    pipVideo.classList.remove('mirror');
                }
                
                startBtn.style.display = 'none';
                mainControls.style.display = 'flex';
                pipContainer.style.display = 'block';
                isRunning = true;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    bufferCanvas.width = video.videoWidth;
                    bufferCanvas.height = video.videoHeight;
                    requestAnimationFrame(processFrame);
                };
            } catch (err) {
                alert("Σφάλμα κάμερας: " + err.message);
            }
        }

        function processFrame(now) {
            if (!isRunning) return;

            const delta = now - lastFrameTime;
            lastFrameTime = now;
            if (delta > 0) {
                fps = (fps * 0.9) + ((1000 / delta) * 0.1);
            }

            bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
            const imgData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            frameBuffer.push(imgData);

            const targetDelaySeconds = parseFloat(delaySlider.value);
            const maxBufferLength = Math.max(1, Math.round(targetDelaySeconds * fps));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            // Apply pan & zoom coordinate offsets
            ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
            ctx.scale(scale, scale);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            if (frameBuffer.length >= maxBufferLength) {
                const delayedFrame = frameBuffer.shift();
                
                // Draw mirrored output only if using the front user-facing camera
                if (currentFacingMode === 'user') {
                    ctx.save();
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    
                    // Temp canvas approach to paint imageData mirrored properly
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    tempCanvas.getContext('2d').putImageData(delayedFrame, 0, 0);
                    ctx.drawImage(tempCanvas, 0, 0);
                    
                    ctx.restore();
                } else {
                    ctx.putImageData(delayedFrame, 0, 0);
                }
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            ctx.restore();

            // Overlay custom drawings vector lines (independent of scale/pan transformations)
            if (drawings.length > 0) {
                ctx.strokeStyle = '#ff3b30';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                let drawing = false;
                for (let i = 0; i < drawings.length; i++) {
                    const pt = drawings[i];
                    if (pt.type === 'start') {
                        ctx.beginPath();
                        ctx.moveTo(pt.x, pt.y);
                        drawing = true;
                    } else if (pt.type === 'move' && drawing) {
                        ctx.lineTo(pt.x, pt.y);
                        ctx.stroke();
                    } else if (pt.type === 'end') {
                        drawing = false;
                    }
                }
            }

            requestAnimationFrame(processFrame);
        }

        // --- Touch Event Handlers for Drawings & Multi-touch Gesture Zoom ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches[0].clientX;
            const clientY = e.touches[0].clientY;
            
            // Normalize coordinate system relative to native internal pixel geometry
            const x = ((clientX - rect.left) / rect.width) * canvas.width;
            const y = ((clientY - rect.top) / rect.height) * canvas.height;
            return { x, y };
        }

        canvas.addEventListener('touchstart', (e) => {
            if (isDrawingMode) {
                isWriting = true;
                const coords = getCanvasCoords(e);
                drawings.push({ type: 'start', x: coords.x, y: coords.y });
            } else {
                // Initialize pan/zoom gesture configurations
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    tpCache = [e.touches[0], e.touches[1]];
                    startScale = scale;
                    startPanX = offsetX;
                    startPanY = offsetY;
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawingMode && isWriting) {
                const coords = getCanvasCoords(e);
                drawings.push({ type: 'move', x: coords.x, y: coords.y });
            } else if (!isDrawingMode) {
                if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - lastTouchX;
                    const dy = e.touches[0].clientY - lastTouchY;
                    offsetX += dx * (canvas.width / canvas.getBoundingClientRect().width);
                    offsetY += dy * (canvas.height / canvas.getBoundingClientRect().height);
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // Pinch zoom length delta evaluations
                    const dx1 = e.touches[0].clientX - e.touches[1].clientX;
                    const dy1 = e.touches[0].clientY - e.touches[1].clientY;
                    const dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);

                    const dx0 = tpCache[0].clientX - tpCache[1].clientX;
                    const dy0 = tpCache[0].clientY - tpCache[1].clientY;
                    const dist0 = Math.sqrt(dx0 * dx0 + dy0 * dy0);

                    if (dist0 > 0) {
                        scale = Math.min(Math.max(startScale * (dist1 / dist0), 1.0), 5.0);
                        updateZoomBadge();
                    }
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (isDrawingMode) {
                isWriting = false;
                drawings.push({ type: 'end' });
            } else {
                isDragging = false;
                if (e.touches.length < 2) tpCache = [];
            }
        }, { passive: true });

    </script>
</body>
</html>
