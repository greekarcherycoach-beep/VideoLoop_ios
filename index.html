<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Delay Loop (iOS Compatible)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VideoDelay">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #canvasContainer {
            position: relative;
            width: 100vw;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #liveVideo {
            display: none;
        }

        #controls {
            width: 100vw;
            height: 30vh;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 200px;
        }

        #delayValue {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            color: #ff3b30;
            min-width: 40px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        #flipBtn {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="displayCanvas"></canvas>
    </div>

    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>

    <div id="controls">
        <div class="control-group">
            <label for="delaySlider">⏱ Καθυστέρηση:</label>
            <input type="range" id="delaySlider" min="0.5" max="10" step="0.5" value="3">
            <span id="delayValue">3.0s</span>
        </div>
        <div class="btn-group">
            <button id="startBtn">Έναρξη Κάμερας</button>
            <button id="flipBtn" style="display:none;">🔄 Αλλαγή Κάμερας</button>
        </div>
    </div>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        const video = document.getElementById('liveVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const startBtn = document.getElementById('startBtn');
        const flipBtn = document.getElementById('flipBtn');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let frameBuffer = [];
        let isRunning = false;
        let fps = 30;
        let lastFrameTime = performance.now();
        let currentFacingMode = "environment"; 
        let currentStream = null;

        delaySlider.addEventListener('input', (e) => {
            delayValue.textContent = parseFloat(e.target.value).toFixed(1) + 's';
        });

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                currentStream = stream;
                video.srcObject = stream;
                video.play();
                
                startBtn.style.display = 'none';
                flipBtn.style.display = 'inline-block';
                
                if (!isRunning) {
                    isRunning = true;
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        bufferCanvas.width = video.videoWidth;
                        bufferCanvas.height = video.videoHeight;
                        requestAnimationFrame(processFrame);
                    };
                } else {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    bufferCanvas.width = video.videoWidth;
                    bufferCanvas.height = video.videoHeight;
                }

            } catch (err) {
                alert("Σφάλμα πρόσβασης στην κάμερα: " + err.message);
            }
        }

        startBtn.addEventListener('click', startCamera);
        
        flipBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            frameBuffer = []; // Clear buffer on switch
            startCamera();
        });

        function processFrame(now) {
            if (!isRunning) return;

            const delta = now - lastFrameTime;
            lastFrameTime = now;
            if (delta > 0) {
                fps = (fps * 0.9) + ((1000 / delta) * 0.1);
            }

            bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
            const imgData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            frameBuffer.push(imgData);

            const targetDelaySeconds = parseFloat(delaySlider.value);
            const maxBufferLength = Math.max(1, Math.round(targetDelaySeconds * fps));

            if (frameBuffer.length >= maxBufferLength) {
                const delayedFrame = frameBuffer.shift();
                ctx.putImageData(delayedFrame, 0, 0);
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
