<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archery Delay</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #canvasContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        
        #startContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #222; display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        #startBtn {
            background: #ff9500; color: #000; padding: 20px 40px;
            font-size: 20px; font-weight: bold; border-radius: 12px; border: none;
            cursor: pointer;
        }
        
        /* 👁️ Νέο κουμπί για Απόκρυψη/Εμφάνιση μενού στην πάνω γωνία */
        #menuToggleBtn {
            position: absolute; top: 40px; right: 20px;
            z-index: 20; background: rgba(0,0,0,0.6); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); width: 45px; height: 45px;
            font-size: 20px; border-radius: 50%; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        
        #ui-overlay {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            z-index: 10; width: 90%; max-width: 400px;
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 16px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease, transform 0.3s ease; /* Ομαλό animation */
        }
        
        /* Κλάση CSS που κρύβει το μενού */
        #ui-overlay.hidden {
            opacity: 0;
            transform: translate(-50%, 30px);
            pointer-events: none; /* Απενεργοποιεί τα κλικ όταν είναι κρυφό */
        }

        .row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        label { color: #fff; font-size: 14px; font-weight: 600; }
        input[type="range"] { flex-grow: 1; accent-color: #ff3b30; height: 30px; }
        #delayValue { color: #ff9500; font-weight: bold; min-width: 45px; text-align: right; }
        
        #toggleCamBtn {
            width: 100%; background: #ff9500; color: #000; border: none; 
            padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; 
            cursor: pointer; display: block;
        }
        #toggleCamBtn:active { background: #e08400; }
    </style>
</head>
<body>

    <div id="startContainer">
        <button id="startBtn">📷 ΕΝΑΡΞΗ ΚΑΜΕΡΑΣ</button>
    </div>

    <!-- 👁️ Το κουμπί απόκρυψης -->
    <button id="menuToggleBtn">👁️</button>

    <div id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
    </div>
    
    <video id="liveVideo" autoplay playsinline muted webkit-playsinline></video>
    
    <div id="ui-overlay">
        <div class="row">
            <label>⏱ Καθυστέρηση:</label>
            <input type="range" id="delaySlider" min="0.5" max="10" step="0.5" value="3">
            <span id="delayValue">3.0s</span>
        </div>
        <button id="toggleCamBtn">🔄 ΕΝΑΛΛΑΓΗ ΚΑΜΕΡΑΣ</button>
    </div>

    <script>
        const video = document.getElementById('liveVideo');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const startContainer = document.getElementById('startContainer');
        const startBtn = document.getElementById('startBtn');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const menuToggleBtn = document.getElementById('menuToggleBtn'); // 👁️ Νέο element
        const uiOverlay = document.getElementById('ui-overlay');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let frameBuffer = [];
        let currentDelay = 3.0;
        let fps = 30;
        let lastTime = performance.now();
        let stream = null;
        let currentFacingMode = 'environment';

        async function initCamera() {
            if (stream) { stream.getTracks().forEach(track => track.stop()); }
            frameBuffer = [];
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
                
                canvas.width = window.innerWidth * window.devicePixelRatio;
                canvas.height = window.innerHeight * window.devicePixelRatio;
                bufferCanvas.width = video.videoWidth || 640;
                bufferCanvas.height = video.videoHeight || 480;
            } catch (err) {
                alert("Σφάλμα κάμερας: " + err.message);
            }
        }

        startBtn.addEventListener('click', async () => {
            startContainer.style.display = 'none';
            menuToggleBtn.style.display = 'flex'; // Εμφάνιση του ματιού μόλις ξεκινήσει η κάμερα
            await initCamera();
            requestAnimationFrame(animationLoop);
        });

        // 👁️ Λειτουργία απόκρυψης / εμφάνισης μενού
        menuToggleBtn.addEventListener('click', () => {
            uiOverlay.classList.toggle('hidden');
        });

        toggleCamBtn.addEventListener('click', async () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await initCamera();
        });

        delaySlider.addEventListener('input', (e) => {
            currentDelay = parseFloat(e.target.value);
            delayValue.textContent = currentDelay.toFixed(1) + 's';
        });

        function animationLoop(now) {
            const delta = now - lastTime;
            lastTime = now;
            if (delta > 0) fps = (fps * 0.9) + ((1000 / delta) * 0.1);

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (bufferCanvas.width !== video.videoWidth || bufferCanvas.height !== video.videoHeight) {
                    bufferCanvas.width = video.videoWidth;
                    bufferCanvas.height = video.videoHeight;
                }
                bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
                const frameData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
                frameBuffer.push(frameData);
            }

            const requiredBufferLength = Math.max(1, Math.round(currentDelay * fps));
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (frameBuffer.length >= requiredBufferLength) {
                const delayedFrame = frameBuffer.shift();
                
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                
                if (currentFacingMode === 'user') {
                    ctx.scale(-1, 1);
                }
                
                const scaleFactor = Math.max(canvas.width / bufferCanvas.width, canvas.height / bufferCanvas.height);
                const dw = bufferCanvas.width * scaleFactor;
                const dh = bufferCanvas.height * scaleFactor;
                
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = bufferCanvas.width; tempCanvas.height = bufferCanvas.height;
                tempCanvas.getContext('2d').putImageData(delayedFrame, 0, 0);
                
                ctx.drawImage(tempCanvas, -dw / 2, -dh / 2, dw, dh);
                ctx.restore();
            }

            requestAnimationFrame(animationLoop);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
