<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archery Simple Test</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        #btnContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 999; }
        #clickBtn { background: #ff9500; color: #000; padding: 25px 50px; font-size: 22px; font-weight: bold; border-radius: 16px; border: none; }
    </style>
</head>
<body>

    <div id="btnContainer">
        <button id="clickBtn">📷 ΑΝΟΙΓΜΑ ΚΑΜΕΡΑΣ</button>
    </div>

    <video id="myVideo" autoplay playsinline muted webkit-playsinline></video>

    <script>
        const video = document.getElementById('myVideo');
        const btnContainer = document.getElementById('btnContainer');
        const clickBtn = document.getElementById('clickBtn');

        clickBtn.addEventListener('click', async () => {
            btnContainer.style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert("iOS Error Details: " + err.name + " - " + err.message);
            }
        });
    </script>
</body>
</html>
