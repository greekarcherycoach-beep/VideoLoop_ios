<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archery Lab Fullscreen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ArcheryLab">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        #canvasContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; position: absolute; width: 1px; height: 1px; opacity: 0; }
        
        #startContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        #startBtn {
            background: #ff9500; color: #000; padding: 20px 40px;
            font-size: 20px; font-weight: bold; border-radius: 16px; border: none;
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4); cursor: pointer;
        }
        #ui-overlay {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            z-index: 10; width: 90%; max-width: 400px;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 16px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        label { color: #fff; font-size: 14px; font-weight: 600; }
        input[type="range"] { flex-grow: 1; accent-color: #ff3b30; height: 30px; }
        #delayValue { color: #ff9500; font-weight: bold; min-width: 45px; text-align: right; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        button { flex: 1; background: #ff9500; color: #000; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; }
        button.active { background: #ff3b30; color: #fff; }
        #zoomBadge { position: absolute; top: 50px; left: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 5; display: none; }
    </style>
</head>
<body>
    <div id="startContainer">
        <button id="startBtn">📷 Ενεργοποίηση Κάμερας</button>
    </div>

    <div id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
    </div>
    <div id="zoomBadge">Zoom: 1.0x</div>
    <video id="liveVideo" autoplay playsinline muted></video>
    
    <div id="ui-overlay">
        <div class="row">
            <label>⏱ Καθυστέρηση:</label>
            <input type="range" id="delaySlider" min="0.5" max="10" step="0.5" value="3">
            <span id="delayValue">3.0s</span>
        </div>
        <div class="btn-group">
            <button id="toggleCamBtn">🔄 Κάμερα</button>
            <button id="drawModeBtn">✏️ Σχεδίαση</button>
            <button id="clearDrawBtn">🗑️ Σβήσιμο</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }

        const video = document.getElementById('liveVideo');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const drawModeBtn = document.getElementById('drawModeBtn');
        const clearDrawBtn = document.getElementById('clearDrawBtn');
        const zoomBadge = document.getElementById('zoomBadge');
        const startContainer = document.getElementById('startContainer');
        const startBtn = document.getElementById('startBtn');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let frameBuffer = [];
        let drawingLines = [];
        let currentLine = null;
        let isDrawingMode = false;
        let currentFacingMode = localStorage.getItem('facingMode') || 'environment';
        let currentDelay = parseFloat(localStorage.getItem('delayValue')) || 3.0;
        
        delaySlider.value = currentDelay;
        delayValue.textContent = currentDelay.toFixed(1) + 's';

        let scale = 1.0, offsetX = 0, offsetY = 0;
        let startX = 0, startY = 0, startScale = 1.0, isPanning = false;
        let initialPinchDist = 0;
        let fps = 30, lastTime = performance.now(), stream = null, animationFrameId = null;

        // Διόρθωση στο κλείσιμο του αρχικού UI
        startBtn.addEventListener('click', () => {
            startContainer.style.display = 'none';
            initCamera();
        });

        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            
            // Χρησιμοποιούμε απλές ρυθμίσεις χωρίς σκληρά όρια ανάλυσης για να μην κρασάρει το iOS PWA
            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 640 }, 
                    height: { ideal: 480 }
                },
                audio: false
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Δίνουμε χρόνο στο iOS να συνδεθεί με το hardware της κάμερας
                setTimeout(() => {
                    video.play().then(() => {
                        resizeCanvases();
                        animationFrameId = requestAnimationFrame(animationLoop);
                    }).catch(e => {
                        // Αν αποτύχει, ξαναπροσπαθούμε μία φορά αυτόματα (iOS WebKit Workaround)
                        video.play().then(() => {
                            resizeCanvases();
                            animationFrameId = requestAnimationFrame(animationLoop);
                        }).catch(err => alert("Αποτυχία εκκίνησης ροής: " + err));
                    });
                }, 300);

            } catch (err) {
                alert("Δεν δόθηκε άδεια ή η κάμερα είναι σε χρήση από άλλη εφαρμογή.");
            }
        }

        function resizeCanvases() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            bufferCanvas.width = video.videoWidth || 640;
            bufferCanvas.height = video.videoHeight || 480;
        }

        window.addEventListener('resize', resizeCanvases);

        delaySlider.addEventListener('input', (e) => {
            currentDelay = parseFloat(e.target.value);
            delayValue.textContent = currentDelay.toFixed(1) + 's';
            localStorage.setItem('delayValue', currentDelay);
        });

        toggleCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            localStorage.setItem('facingMode', currentFacingMode);
            initCamera();
        });

        drawModeBtn.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;
            drawModeBtn.classList.toggle('active', isDrawingMode);
        });

        clearDrawBtn.addEventListener('click', () => { drawingLines = []; });

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            if (isDrawingMode) {
                const t = e.touches[0];
                currentLine = [{
                    x: ((t.clientX - rect.left) / rect.width) * canvas.width,
                    y: ((t.clientY - rect.top) / rect.height) * canvas.height
                }];
                drawingLines.push(currentLine);
            } else {
                if (e.touches.length === 1) {
                    isPanning = true;
                    startX = e.touches[0].clientX - offsetX;
                    startY = e.touches[0].clientY - offsetY;
                } else if (e.touches.length === 2) {
                    isPanning = false;
                    startScale = scale;
                    initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            if (isDrawingMode && currentLine) {
                const t = e.touches[0];
                currentLine.push({
                    x: ((t.clientX - rect.left) / rect.width) * canvas.width,
                    y: ((t.clientY - rect.top) / rect.height) * canvas.height
                });
            } else {
                if (isPanning && e.touches.length === 1) {
                    offsetX = e.touches[0].clientX - startX;
                    offsetY = e.touches[0].clientY - startY;
                } else if (e.touches.length === 2) {
const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
scale = Math.max(1.0, Math.min(5.0, startScale * (dist / initialPinchDist)));
zoomBadge.style.display = scale > 1.0 ? 'block' : 'none';
zoomBadge.textContent = Zoom: ${scale.toFixed(1)}x;
}
}
});
canvas.addEventListener('touchend', () => { isPanning = false; currentLine = null; });
function animationLoop(now) {
const delta = now - lastTime;
lastTime = now;
if (delta > 0) fps = (fps * 0.9) + ((1000 / delta) * 0.1);
if (video.readyState === video.HAVE_ENOUGH_DATA) {
if (bufferCanvas.width !== video.videoWidth || bufferCanvas.height !== video.videoHeight) {
resizeCanvases();
}
bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
const frameData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
frameBuffer.push(frameData);
}
const requiredBufferLength = Math.max(1, Math.round(currentDelay * fps));
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (frameBuffer.length >= requiredBufferLength) {
const delayedFrame = frameBuffer.shift();
ctx.save();
ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
ctx.scale(scale, scale);
if (currentFacingMode === 'user') ctx.scale(-1, 1);
const cw = canvas.width, ch = canvas.height;
const iw = bufferCanvas.width, ih = bufferCanvas.height;
const scaleFactor = Math.max(cw / iw, ch / ih);
const dw = iw * scaleFactor, dh = ih * scaleFactor;
const tempCanvas = document.createElement('canvas');
tempCanvas.width = iw; tempCanvas.height = ih;
tempCanvas.getContext('2d').putImageData(delayedFrame, 0, 0);
ctx.drawImage(tempCanvas, -dw / 2, -dh / 2, dw, dh);
ctx.restore();
}
ctx.lineWidth = 6; ctx.strokeStyle = '#ff3b30'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
for (let line of drawingLines) {
if (line.length < 2) continue;
ctx.beginPath(); ctx.moveTo(line[0].x, line[0].y);
for (let i = 1; i < line.length; i++) ctx.lineTo(line[i].x, line[i].y);
ctx.stroke();
}
animationFrameId = requestAnimationFrame(animationLoop);
}
